{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Correo Enviado | F.A.S</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config={theme:{extend:{colors:{'fas-blue':'#1a73e8','fas-dark-blue':'#0d47a1','fas-yellow':'#ffb300','fas-gray-bg':'#f4f6f9'}}}}</script>
</head>
<body class="flex flex-col min-h-screen bg-fas-gray-bg">

    <nav class="bg-fas-blue shadow-lg">
        <div class="container mx-auto px-4 h-20 flex items-center">
            <a href="{% url 'landingpage' %}" class="flex items-center space-x-2">
                <img src="{% static 'public/images/Logo.png' %}" alt="Logo" class="w-16 h-16 rounded-full shadow-md mr-2">
                <p class="text-white text-3xl font-extrabold tracking-wide m-0">F.A.S</p>
            </a>
        </div>
    </nav>

    <div class="max-w-md mx-auto mt-12 mb-12 bg-white p-8 rounded-xl shadow-2xl w-full text-center">
        <div class="flex justify-center mb-5">
            <div class="w-20 h-20 rounded-full bg-blue-100 flex items-center justify-center">
                <svg class="w-10 h-10 text-fas-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
            </div>
        </div>
        <h3 class="text-2xl font-extrabold text-fas-dark-blue mb-2">¡Correo enviado!</h3>
        <p class="text-gray-400 text-sm mb-8">Revisa tu bandeja de entrada y sigue el enlace para restablecer tu contraseña. El enlace expira en 24 horas.</p>
        <a href="{% url 'login' %}"
            class="w-full bg-fas-blue text-white font-bold py-3 px-4 rounded-xl shadow-lg hover:bg-fas-dark-blue transition duration-300 flex items-center justify-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14"/>
            </svg>
            Volver al inicio de sesión
        </a>
    </div>

    <footer class="bg-fas-yellow py-4 shadow-xl mt-auto">
        <div class="container mx-auto px-4 flex items-center justify-between flex-col sm:flex-row">
            <div class="flex items-center space-x-3 mb-4 sm:mb-0">
                <img src="{% static 'public/images/Logo.png' %}" alt="Logo" class="w-12 h-12 rounded-full"/>
                <p class="text-gray-800 font-bold">F.A.S</p>
            </div>
            <p class="text-gray-700 text-sm">© Football Association System. Todos los derechos reservados</p>
        </div>
    </footer>
</body>
</html>
